[package]
name = "switchbot"
version = "0.1.0"
edition = "2021"

[dependencies]
clap        = { version = "4", features = ["derive"] }
reqwest     = { version = "0.12", features = ["rustls-tls", "blocking", "json"], default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
hmac        = "0.12"
sha2        = "0.10"
base64      = "0.22"
uuid        = { version = "1", features = ["v4"] }
directories = "5"
anyhow      = "1"
chrono      = "0.4"

[dev-dependencies]
tempfile    = "3"

[profile.release]
strip = true
lto   = "thin"
